# dsh-toolkit —— QQ 远程驾驶 + 界面暂停按钮 + 重启 DSH（含重启后自动续跑）
#
# 配置是分组的：qq / pause / restart 三段各自对应 lib/<模块>.js 里的 Config。
# 键名与 schema 一致；写错的键不会让插件加载失败（schemastery 的 object 非 strict，
# 未知键被原样 merge 后忽略），但那段配置等于没写，排查时容易误判成已生效。
# 改 schema 时同步改这里。
- insert:
    - id: dsh-toolkit
      name: dsh-toolkit
      config:
        qq:
          enabled: true
          ws_url: 'ws://127.0.0.1:3001'
          access_token: ''
          allow_users: [123456789]
          prefix: '#'
          default_session: ''
          aliases: []
          list_limit: 12
          route_ttl_secs: 1800
          reply_chunk_size: 4000
          silence_notice: true
          hint: ''
          napcat_path: '<NapCat 安装目录>\NapCatQQ-Desktop.exe'
          start_wait_secs: 90
          dsh_exe: '<DSH 安装目录>\DeepSeek Harness.exe'
          pair_link_autosend: false
          pair_link_address: ''
          link_proxy_port: 62566
          link_public_host: ''
          approval_remote: true
          approval_timeout_secs: 300
          questions_remote: true
          question_timeout_secs: 1800
          progress_secs: 0
        restart:
          enabled: true
          task_name: 'DSH Restart Now'
          default_delay_secs: 20
          min_delay_secs: 5
          log_path: 'C:\Users\<you>\.dsh\dsh-restart.log'
          request_path: 'C:\Users\<you>\.dsh\dsh-restart-request.json'
          resume_path: 'C:\Users\<you>\.dsh\dsh-toolkit-resume.json'
          resume_max: 2
          resume_ttl_secs: 900
